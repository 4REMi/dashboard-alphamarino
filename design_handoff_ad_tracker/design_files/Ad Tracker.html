<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Vantage — Ad Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="nav.jsx"></script>
  <script type="text/babel" src="discovery.jsx"></script>
  <script type="text/babel" src="detail-modal.jsx"></script>
  <script type="text/babel" src="clone-modal.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeNav, setActiveNav] = useState("discovery");
      const [activeSub, setActiveSub] = useState("all");
      const [search, setSearch] = useState("");
      const [openAd, setOpenAd] = useState(null);   // detail modal
      const [cloneAd, setCloneAd] = useState(null); // clone flow

      const ads = window.AdData.ads.filter(ad => {
        if (!search.trim()) return true;
        const s = search.toLowerCase();
        return ad.brand.name.toLowerCase().includes(s) ||
               ad.hook.toLowerCase().includes(s) ||
               ad.brand.vertical.toLowerCase().includes(s);
      });

      // close on ESC
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "Escape") {
            if (cloneAd) setCloneAd(null);
            else if (openAd) setOpenAd(null);
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [openAd, cloneAd]);

      return (
        <div className="app">
          <Sidebar
            activeNav={activeNav} setActiveNav={setActiveNav}
            activeSub={activeSub} setActiveSub={setActiveSub}
          />
          <div className="main">
            <TopNav search={search} setSearch={setSearch}/>
            <Discovery
              ads={ads}
              onOpen={(ad) => setOpenAd(ad)}
              onClone={(ad) => { setOpenAd(null); setCloneAd(ad); }}
            />
          </div>

          {openAd && !cloneAd && (
            <DetailModal
              ad={openAd}
              onClose={() => setOpenAd(null)}
              onStartClone={(ad) => { setOpenAd(null); setCloneAd(ad); }}
            />
          )}

          {cloneAd && (
            <CloneModal
              ad={cloneAd}
              onClose={() => setCloneAd(null)}
              onComplete={() => setCloneAd(null)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
